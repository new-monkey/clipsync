# default configuration for clipsync v2

roles:
  - server

server:
  listen: ":8080"
  ws_path: "/v2/ws"
  tls:
    enabled: true
    cert_file: "./certs/fullchain.pem"
    key_file: "./certs/privkey.pem"

auth:
  jwt_secret: "CHANGE_ME"

storage:
  type: "memory"

channels:
  default:
    public: true
    retention_days: 7
